---
name: Build VantaGate Desktop

# VantaGate Desktop 的 Windows 打包 CI。
# 注意：此文件不能由 Muse GitHub App 推送（App 没有 Workflows 权限，推
# .github/workflows/* 会 403）。请在浏览器里手动创建
# .github/workflows/build-vantagate-desktop.yml，内容与此文件完全一致。
# CI 首次跑通之前，不要宣称编译通过、不要打 tag、不要发 Release。

on:
  push:
    branches: [vantagate-desktop]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 中文安装器改用 Inno Setup（packageExeZh）；不再需要 WiX。
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
          } else {
            Write-Host "Inno Setup already present: $(Get-Command ISCC.exe | Select-Object -ExpandProperty Source)"
          }

      - name: Build .exe
        run: .\gradlew.bat :desktop:packageExeZh --stacktrace

      - name: Run desktop tests
        run: .\gradlew.bat :desktop:jvmTest --tests "dev.aigw.desktop.update.UpdateCheckerTest"

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantaGate-2.17.0-win64
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
