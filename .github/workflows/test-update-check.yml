name: Test update check (Windows)

on:
  push:
    branches: [fix/update-check-desktop-tag-filter]
  workflow_dispatch:

jobs:
  update-check-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run UpdateTagFilterTest
        run: .\gradlew.bat :desktop:jvmTest --tests "com.vantacode.feature.settings.data.remote.UpdateTagFilterTest"
