name: Build VantaCode Desktop

on:
  push:
    branches: [main, desktop/plugin-compat-phase2]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test desktop
        run: .\gradlew.bat :desktop:compileKotlinJvm :desktop:jvmTest --stacktrace
      - name: Package .exe
        run: .\gradlew.bat :desktop:packageExe --stacktrace
      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantaCode-win64
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
