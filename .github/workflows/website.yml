# Vanta 官网：同步版本数据并发布到 GitHub Pages。
name: Vanta 官网
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/sync-website.py"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync website data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-website.py
      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data.json
          git diff --cached --quiet || git commit -m "website: sync data.json (auto)"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
