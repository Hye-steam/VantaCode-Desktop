# 基准环境为 GitHub Actions 公共仓库 runner：4 vCPU / 16 GB RAM / 14 GB SSD。
# 本机容器只有 7.6GB 总内存，堆不能跟着 CI 走：R8 阶段堆膨胀到 7g 会
# 触发系统低内存回收，Android 直接把前台 App 连同容器里的 Gradle 一起杀掉
# （实测连续 3 次都在 minifyArmsoloReleaseWithR8 阶段被打断）。
# 本机取 2560m + 768m metaspace，配合单 worker 串行，峰值稳定在 4GB 以内。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC

# Kotlin 编译改 in-process：跑进 Gradle daemon，省掉独立的 Kotlin daemon JVM（再省一份内存）。
# 官方推荐策略之一，详见 kotlin.compiler.execution.strategy。
kotlin.compiler.execution.strategy=in-process

# 本机内存只有 CI runner 的一半，并行会同时开多个 worker 进程各自占堆，
# R8 期间叠加后必然触发系统回收，故本机串行构建。
org.gradle.workers.max=2

org.gradle.caching=true
org.gradle.parallel=false
org.gradle.daemon=true
# 配置缓存：缓存命中时直接跳过整个配置阶段（脚本编译 + 插件初始化与 task 图构建）。
# problems=warn 让不兼容项只告警不中断构建。
# 注意属性名：叫 configuration-cache（不是 configure-cache），写错不会报错而是默默失效。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.enableJetifier=true
# Jetifier 跳过 byte-buddy（mockk 传递依赖）：其 1.18.x 是 multi-release jar，
# META-INF/versions/24/ 下类按 Java 24 编译（class file 68），Jetifier 内置 ASM 不支持。
# 它是纯 JVM 测试库、不引用 support 包，无需转换。
android.jetifier.ignorelist=byte-buddy,byte-buddy-agent

android.suppressUnsupportedCompileSdk=37

# ARM64 容器：使用 SDK 自带的 ARM64 aapt2（Maven 下载的是 x86_64）
android.aapt2FromMavenOverride=/root/android/sdk/build-tools/35.0.0/aapt2
